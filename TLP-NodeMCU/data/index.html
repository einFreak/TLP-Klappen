<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLP-Klappen AP Status</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <template id="flap-card-template">
    <div class="flap-card" data-flap-id="">
      <div class="flap-container-wrapper">
        <div class="flap-visual" role="button" tabindex="0" aria-label="Details oeffnen" data-flap-visual="">
          <img class="flap-svg flap-up" src="/flap-up.svg" alt="Klappe hoch">
          <img class="flap-svg flap-down" src="/flap-down.svg" alt="Klappe gefallen">
        </div>
        <div class="flap-quick-actions">
          <button class="quick-btn quick-btn--move" type="button" data-move-flap="" title="Verschieben">☷</button>
          <button class="quick-btn" type="button" data-action="up" data-flap-id="" title="Auf">↑</button>
          <button class="quick-btn" type="button" data-action="down" data-flap-id="" title="Runter">↓</button>
          <button class="quick-btn" type="button" data-action="toggle" data-flap-id="" title="Umschalten">⇄</button>
          <button class="quick-btn" type="button" data-action="reset" data-flap-id="" title="Zurücksetzen">↻</button>
        </div>
      </div>
    </div>
  </template>

  <div class="dashboard">
    <section class="stage-panel">
      <header class="stage-header">
        <h1>TLP Klappenstand</h1>
        <p>Multi-Node Stage</p>
      </header>
      <div id="flapStage" class="flap-stage"></div>
      <div id="flapStageResizeHandle" class="flap-stage-resize-handle" role="separator" aria-orientation="horizontal" aria-label="Stage Hoehe anpassen"></div>
      <div class="stage-bulk-actions">
        <button type="button" id="allFlapsUpBtn">All Flaps up</button>
        <button type="button" id="allFlapsDownBtn">All Flaps down</button>
      </div>
    </section>

    <section class="detail-panel-container" id="detailPanel" aria-hidden="true">
      <header class="detail-header">
        <h2 data-field="cardLabel">Node</h2>
        <button class="icon-btn" type="button" aria-label="Close details" id="closeDetailBtn">X</button>
      </header>
      <div class="detail-grid">
        <div class="detail-item"><span>Node ID</span><strong data-field="detailNodeId">-</strong></div>
        <div class="detail-item"><span>Online</span><strong data-field="detailOnline">-</strong></div>
        <div class="detail-item"><span>State</span><strong data-field="detailState">-</strong></div>
        <div class="detail-item"><span>Mode</span><strong data-field="detailMode">-</strong></div>
        <div class="detail-item"><span>Heartbeat</span><strong data-field="detailHeartbeat">-</strong></div>
        <div class="detail-item"><span>Reboots</span><strong data-field="detailReboots">-</strong></div>
        <div class="detail-item"><span>Status Flags</span><strong data-field="detailFlags">-</strong></div>
        <div class="detail-item"><span>Uptime (s)</span><strong data-field="detailUptime">-</strong></div>
        <div class="detail-item"><span>Sensor Raw</span><strong data-field="detailSensorRaw">-</strong></div>
        <div class="detail-item"><span>Sensor Peak</span><strong data-field="detailSensorPeak">-</strong></div>
        <div class="detail-item"><span>Sensor Noise</span><strong data-field="detailSensorNoise">-</strong></div>
        <div class="detail-item"><span>Last UP Time</span><strong data-field="detailLastUpTime">-</strong></div>
        <div class="detail-item"><span>Threshold</span><strong data-field="detailThreshold">-</strong></div>
      </div>
      <div class="threshold-box">
        <label for="detailThresholdInput">Threshold setzen (0-1023)</label>
        <div class="threshold-edit">
          <input id="detailThresholdInput" type="number" min="0" max="1023" step="1" value="60" data-field="thresholdInput">
          <button type="button" data-apply-threshold="" data-flap-id="">Setzen</button>
        </div>
      </div>
      <div class="control-row">
        <button type="button" data-action="up" data-flap-id="">UP</button>
        <button type="button" data-action="down" data-flap-id="">DOWN</button>
        <button type="button" data-action="toggle" data-flap-id="">TOGGLE</button>
        <button type="button" data-action="auto" data-flap-id="">AUTO</button>
        <button type="button" data-action="reset" data-flap-id="">RESET</button>
      </div>
      <div class="command-status" data-field="commandStatus">Bereit</div>
    </section>

    <footer class="network-panel">
      <h2>Netzwerk</h2>
      <div class="status-grid">
        <div class="status-item">
          <div class="status-label">SSID</div>
          <div class="status-value" id="apSsid">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">IP Address</div>
          <div class="status-value" id="apIp">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">Channel</div>
          <div class="status-value" id="apChannel">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">Connected Clients</div>
          <div class="status-value" id="apClients">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">MAC Address</div>
          <div class="status-value" id="apMac">-</div>
        </div>
      </div>
      <div class="connection-indicator">
        <div class="dot"></div>
        <div class="connection-text" id="connectionStatus">Connecting...</div>
      </div>
    </footer>
  </div>

  <script src="/app.js"></script>
  <script src="/api.js"></script>
</body>
</html>
