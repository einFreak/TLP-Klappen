<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLP-Klappen AP Status</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Flap card template: cloned per flap in app.js -->
  <template id="flap-card-template">
    <div class="flap-card" data-flap-id="">
      <div class="flap-visual" role="button" tabindex="0" aria-label="Details öffnen" data-flap-visual="">
        <img class="flap-svg flap-up" src="/flap-up.svg" alt="Klappe hoch">
        <img class="flap-svg flap-down" src="/flap-down.svg" alt="Klappe gefallen">
      </div>
      <div class="flap-metrics">
        <div class="metric-pill"><span>State</span><strong data-field="flapState">-</strong></div>
        <div class="metric-pill"><span>Mode</span><strong data-field="flapMode" class="badge">-</strong></div>
        <div class="metric-pill"><span>Latch</span><strong data-field="flapLatch" class="badge">-</strong></div>
        <div class="metric-pill"><span>Threshold</span><strong data-field="flapThreshold">-</strong></div>
        <div class="metric-pill wide"><span>Last Trigger Raw</span><strong data-field="lastTriggerRaw">-</strong></div>
      </div>
      <section class="flap-detail-panel" aria-hidden="true">
        <header class="detail-header">
          <h2 data-field="cardLabel">Klappe</h2>
          <button class="icon-btn" type="button" aria-label="Close details" data-close-detail="">✕</button>
        </header>
        <div class="detail-grid">
          <div class="detail-item"><span>Zustand</span><strong data-field="detailState">-</strong></div>
          <div class="detail-item"><span>Mode</span><strong data-field="detailMode">-</strong></div>
          <div class="detail-item"><span>Trigger Raw</span><strong data-field="detailTriggerRaw">-</strong></div>
          <div class="detail-item"><span>Trigger Envelope</span><strong data-field="detailTriggerEnvelope">-</strong></div>
          <div class="detail-item wide"><span>Trigger Zeitpunkt (ms)</span><strong data-field="detailTriggerAt">-</strong></div>
        </div>
        <div class="control-row">
          <button type="button" data-action="up" data-flap-id="">UP</button>
          <button type="button" data-action="down" data-flap-id="">DOWN</button>
          <button type="button" data-action="toggle" data-flap-id="">TOGGLE</button>
          <button type="button" data-action="auto" data-flap-id="">AUTO</button>
          <button type="button" data-action="reset" data-flap-id="">RESET</button>
        </div>
        <div class="threshold-box">
          <label>Schwellwert</label>
          <input data-field="thresholdRange" type="range" min="0" max="1023" step="1" value="60">
          <div class="threshold-edit">
            <input data-field="thresholdNumber" type="number" min="0" max="1023" step="1" value="60">
            <button type="button" data-apply-threshold="">Setzen</button>
          </div>
        </div>
      </section>
    </div>
  </template>

  <div class="dashboard">
    <section class="stage-panel">
      <header class="stage-header">
        <h1>TLP Klappenstand</h1>
        <p>Single-Flap Stage</p>
      </header>

      <div id="flapStage" class="flap-stage"></div>
    </section>

    <aside class="network-panel">
      <h2>Netzwerk</h2>
      <div class="status-grid">
        <div class="status-item">
          <div class="status-label">SSID</div>
          <div class="status-value" id="apSsid">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">IP Address</div>
          <div class="status-value" id="apIp">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">Channel</div>
          <div class="status-value" id="apChannel">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">Connected Clients</div>
          <div class="status-value" id="apClients">-</div>
        </div>
        <div class="status-item">
          <div class="status-label">MAC Address</div>
          <div class="status-value" id="apMac">-</div>
        </div>
      </div>

      <div class="connection-indicator">
        <div class="dot"></div>
        <div class="connection-text" id="connectionStatus">Connecting...</div>
      </div>
    </aside>
  </div>

  <script src="/app.js"></script>
</body>
</html>
